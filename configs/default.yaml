# ---------------------------------------------------------------------------
# flood-risk-curitiba — configuração central do pipeline
#
# Este arquivo é a ÚNICA fonte de verdade para parâmetros espaciais, temporais
# e de modelagem. Nenhum número mágico deve aparecer no código.
# Sobrescreva pontualmente com: --config configs/experimento_x.yaml
# ---------------------------------------------------------------------------

project:
  name: flood-risk-curitiba
  # WGS84 para entrada/saída de dados públicos e mapas web.
  crs_geo: EPSG:4326
  # SIRGAS 2000 / UTM 22S — CRS métrico oficial brasileiro para Curitiba.
  # Toda operação de área, distância, buffer e declividade acontece aqui.
  crs_metric: EPSG:31982
  random_seed: 42

aoi:
  # Bounding box do município de Curitiba em WGS84 [oeste, sul, leste, norte].
  # Usado como fallback e para consulta às APIs de satélite.
  bbox: [-49.3960, -25.6560, -49.1840, -25.3440]
  # Limite municipal oficial (IBGE / Dados Abertos Curitiba). Quando presente,
  # tem precedência sobre a bbox no recorte final dos rasters.
  boundary_file: data/raw/limites/curitiba_municipio.geojson

boundary:
  # Malha municipal oficial, API de malhas do IBGE (v3). Acesso público, sem chave.
  source: ibge
  municipality_code: "4106902"   # Curitiba
  url: "https://servicodados.ibge.gov.br/api/v3/malhas/municipios/4106902?formato=application/vnd.geo+json&qualidade=maxima"
  # O IBGE publica em SIRGAS 2000 geográfico. A diferença para WGS84 é submétrica.
  source_crs: EPSG:4674
  # Área oficial do município. Serve de rede de segurança: se o download vier com
  # outro município, parcial, ou a API mudar de contrato, a área denuncia e o
  # estágio falha em vez de gravar um polígono errado em silêncio.
  expected_area_km2: 435.0
  area_tolerance_pct: 10.0
  request_timeout_s: 60
  max_retries: 3

raster:
  # Resolução nativa das bandas visíveis/NIR do Sentinel-2.
  resolution_m: 10
  # Patches de treino da U-Net.
  #
  # 128 px = 1.280 m de lado. Com 256 px a bbox de Curitiba rende ~150 patches,
  # e depois do split espacial (que descarta quem cruza divisa de bloco) sobram
  # ~20 para teste — amostra pequena demais para uma métrica defensável. Com
  # 128 px o mesmo território rende ~4x mais amostras sem mudar um pixel do
  # dado, e o bloco do split cabe com folga em torno do patch.
  # 128 é divisível por 32, que é o fator de subamostragem do encoder ResNet34.
  patch_size: 128
  patch_overlap: 16
  # Descarta patches com menos que esta fração de pixels válidos (nodata/nuvem).
  min_valid_fraction: 0.90
  # Sobreposição na INFERÊNCIA — maior que a do treino de propósito.
  #
  # A borda do patch é onde a predição é pior: o campo receptivo de um pixel no
  # canto viu metade do contexto de um pixel no centro. Colar patches encostados
  # produz costura visível a cada 128 px, que num mapa de risco vira faixa de
  # risco seguindo a grade de processamento em vez do território.
  # Com 64 px cada pixel é predito por várias janelas, em posições diferentes
  # dentro de cada uma, e o 'infer' faz a média ponderada por janela de Hann.
  inference_overlap: 64

grid:
  # Célula de agregação zonal dos resultados (mapa de suscetibilidade).
  cell_size_m: 200
  # Fração mínima da célula coberta por pixel válido para ela entrar no mapa.
  # Célula de borda do município pode ter só uma nesga dentro do dado; a média
  # ali seria de meia dúzia de pixels e não representaria a célula.
  min_valid_fraction: 0.5

sentinel:
  # Copernicus Data Space Ecosystem — serviço GRATUITO da ESA.
  # NÃO confundir com apps.sentinel-hub.com, que é o comercial com trial expirável.
  # Credenciais no .env: CDSE_CLIENT_ID / CDSE_CLIENT_SECRET.
  # Cota do plano gratuito: 10.000 PU/mês, 10.000 req/mês, 300 req/min.
  collection: sentinel-2-l2a
  base_url: https://sh.dataspace.copernicus.eu
  token_url: https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token
  # CRS DA REQUISIÇÃO — não confundir com project.crs_metric.
  # O Process API só aceita WGS84, Pseudo-Mercator e zonas UTM WGS84; pedir em
  # SIRGAS 2000 (EPSG:31982) devolve "Unsupported CRS value".
  # Então a aquisição acontece em WGS84 / UTM 22S e o mosaico é reprojetado uma
  # única vez para o CRS de análise. A diferença entre os dois data em território
  # brasileiro é de poucos centímetros, muito abaixo do pixel de 10 m.
  request_crs: EPSG:32722
  # Janela de composição.
  #
  # CUIDADO: requisição multi-temporal é cobrada POR CENA. O custo em processing
  # units é linear no número de datas desta janela, então dobrar o período dobra
  # a conta. Um ano rende ~24 datas com nuvem < 20% sobre Curitiba, o que já é
  # amostra suficiente para uma mediana estável de impermeabilidade — superfície
  # construída não muda de mês para mês.
  # Rode `probe-sentinel` depois de mexer aqui: ele recalcula o custo.
  date_start: "2024-01-01"
  date_end: "2024-12-31"
  max_cloud_cover: 20
  bands: [B02, B03, B04, B08]
  # Mediana temporal: robusta a nuvem residual e sombra.
  composite: median
  # Lado do tile de requisição, em pixels. O Process API recusa saída acima de
  # 2500 px por lado, então a cidade é pedida em pedaços e costurada localmente.
  request_tile_px: 2048
  # Classes da Scene Classification Layer descartadas antes da mediana:
  # 0 nodata · 1 saturado · 3 sombra de nuvem · 8 nuvem média · 9 nuvem alta
  # 10 cirrus · 11 neve. Mantém 2 (área escura), 4 (vegetação),
  # 5 (não vegetado), 6 (água) e 7 (não classificado) — é em 5 e 7 que a
  # superfície impermeável costuma cair.
  invalid_scl_classes: [0, 1, 3, 8, 9, 10, 11]
  # Teto de processing units por execução do acquire-sentinel. A cota do plano
  # gratuito é 10.000 PU/mês; este limite deixa margem para refazer o download
  # depois de um erro sem perder o mês. `acquire-sentinel` se recusa a rodar se
  # a estimativa passar daqui.
  max_processing_units: 2000

ground_truth:
  # Máscara binária de superfície impermeável = vias OR WorldCover(50).
  #
  # Fonte das vias: 'geocuritiba' (cadastro oficial do município, padrão) ou
  # 'osm' (OpenStreetMap via Overpass, mantido como alternativa). O build-mask
  # lê esta chave e não precisa saber de onde as vias vieram.
  roads_source: geocuritiba

  streets:
    # GeoCuritiba / IPPUC — serviço ArcGIS REST da Prefeitura de Curitiba.
    # Escolhido sobre o OSM por três motivos: é o cadastro OFICIAL do município,
    # já vem em EPSG:31982 (nosso CRS de análise, zero reprojeção) e não depende
    # de servidor voluntário com limite de taxa.
    source: geocuritiba
    service_url: "https://geocuritiba.ippuc.org.br/server/rest/services/GeoCuritiba/Publico_GeoCuritiba_MapaCadastral/MapServer"
    layer_id: 11
    layer_name: "Trecho Logradouro"
    source_crs: EPSG:31982
    out_fields: [objectid, gtm_nm_logradouro, hierarquia_viaria, sist_viario_classificado]
    hierarchy_field: hierarquia_viaria
    # Sem ordem estável, resultOffset pode repetir e pular feições entre páginas.
    order_by_field: objectid
    page_size: 2000          # teto do serviço
    max_pages: 200           # trava contra laço infinito na paginação
    request_timeout_s: 120
    max_retries: 3
    # Meia-largura da pista, em metros, por valor de hierarquia viária.
    #
    # O serviço não publica o domínio dos códigos, mas a distribuição de extensão
    # medida no dado é conclusiva quanto à ORDEM (1 = via de maior hierarquia,
    # 4 = via local):
    #   1 -> 84 km · 2 -> 94 km · 3 -> 583 km · 4 -> 3.861 km
    # As larguras abaixo são estimativas típicas por categoria, não medidas.
    #
    # MEDIDO: calibrar isto muda pouco o rótulo. A malha viária acrescenta ~0,9
    # ponto percentual sobre o WorldCover sozinho, porque o WorldCover já captura
    # cerca de 5/6 das vias em área urbana consolidada. Os buffers estão certos
    # por correção, não por impacto.
    default_buffer_m: 4.5
    hierarchy_buffers_m:
      "1": 15.0   # estrutural / via rápida
      "2": 10.0   # prioritária / arterial
      "3": 7.0    # coletora
      "4": 4.5    # local

  worldcover:
    # Bucket público da ESA na AWS, acesso anônimo. Lido por janela via /vsicurl:
    # o tile cobre 3° x 3° e pesa centenas de MB, mas só o AOI é transferido.
    year: 2021
    version: v200
    builtup_class: 50   # "built-up" na legenda do WorldCover
    url_template: "https://esa-worldcover.s3.eu-central-1.amazonaws.com/{version}/{year}/map/ESA_WorldCover_10m_{year}_{version}_{tile}_Map.tif"
    tile_size_deg: 3
  osm:
    # Espelhos do Overpass, tentados em ordem. O overpass-api.de passou a filtrar
    # tráfego programático e devolve HTTP 406 de forma persistente, então ele fica
    # por último: insistir nele não resolve, trocar de espelho resolve.
    # A resposta crua fica em data/raw/osm/, então repetir o estágio não bate no
    # servidor de novo.
    overpass_urls:
      - https://overpass.kumi.systems/api/interpreter
      - https://lz4.overpass-api.de/api/interpreter
      - https://z.overpass-api.de/api/interpreter
      - https://overpass.private.coffee/api/interpreter
      - https://overpass-api.de/api/interpreter
    request_timeout_s: 300
    max_retries: 3
    # Buffer hierárquico por tipo de via, em metros (meia-largura da pista).
    # Esta lista tem papel duplo: define a largura E filtra o que é baixado.
    road_buffers_m:
      motorway: 12.0
      trunk: 10.0
      primary: 9.0
      secondary: 7.0
      tertiary: 6.0
      residential: 5.0
      unclassified: 4.5
      service: 4.0
      living_street: 4.0

terrain:
  # Copernicus DEM GLO-30 — 30 m, cobertura global, licença aberta, bucket
  # público na AWS com acesso anônimo. Tiles de 1 grau nomeados pelo canto
  # SUDOESTE; Curitiba cai inteira em S26_00_W050_00.
  dem_source: copernicus-glo-30
  url_template: "https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_{tile}_DEM/Copernicus_DSM_COG_10_{tile}_DEM.tif"
  slope_units: degrees
  # Reamostragem BILINEAR para a grade de 10 m: elevação é contínua, e vizinho
  # mais próximo criaria degraus de 30 m que virariam declividade serrilhada.
  # Isso alinha a grade, NÃO cria detalhe — a declividade carrega informação de
  # 30 m, e o documento precisa dizer isso.
  resample_to_resolution: true
  # Rede de segurança: Curitiba está no primeiro planalto paranaense, perto de
  # 900 m. Recorte que devolva altitude de nível do mar é outro tile.
  expected_elevation_range_m: [700.0, 1200.0]

occurrences:
  # ALVO SUPERVISIONADO — fonte ainda a definir (ver Fase 1).
  # Candidatos: chamados 156 da Prefeitura, Defesa Civil PR, CEMADEN.
  source: null
  path: data/raw/ocorrencias/alagamentos.geojson
  date_field: data_ocorrencia
  # Raio de incerteza posicional do registro (endereço → ponto).
  positional_tolerance_m: 100

forecast:
  # Open-Meteo. Uso não-comercial: sem API key. Licença CC-BY 4.0 — a atribuição
  # abaixo é OBRIGATÓRIA e precisa aparecer visível no site publicado.
  # Limites do plano gratuito: 600/min, 5.000/h, 10.000/dia.
  provider: open-meteo
  forecast_endpoint: https://api.open-meteo.com/v1/forecast
  archive_endpoint: https://archive-api.open-meteo.com/v1/archive
  timezone: America/Sao_Paulo
  # Horizonte exibido no site. Open-Meteo entrega até 16 dias (384 h).
  horizon_hours: 48
  # Centroide aproximado de Curitiba. A célula do modelo tem 9–11 km, então não
  # existe informação intraurbana a extrair: a chuva entra como valor da cidade.
  reference_point:
    lat: -25.4284
    lon: -49.2733
  # Janela de acumulado usada para escolher o cenário de chuva.
  accumulation_window_h: 6
  attribution: "Dados meteorológicos: Open-Meteo.com (CC-BY 4.0)"
  request_timeout_s: 30
  max_retries: 3

risk_scenarios:
  # Patamares de chuva que selecionam qual camada de risco o site exibe.
  #
  # PROCEDÊNCIA: são os critérios de Aviso Meteorológico de "chuvas intensas" do
  # INMET, o órgão federal de meteorologia. Não são escolha deste trabalho — são
  # a régua oficial usada para emitir alerta à população brasileira:
  #
  #     amarelo  (perigo potencial) .. 20-30 mm/h  ou  até 50 mm/dia
  #     laranja  (perigo) ............ 30-60 mm/h  ou  50-100 mm/dia
  #     vermelho (grande perigo) ..... > 60 mm/h   ou  > 100 mm/dia
  #
  # Adotar a régua do órgão oficial resolve o problema que a banca levantou:
  # o corte deixa de ser opinião do autor e passa a ser critério normativo
  # citável. E a escala confere com o que a cidade registra — 60 mm causaram
  # alagamentos, 100 mm atingiram 13 bairros, 129 mm atingiram 23.
  #
  # Os 20/40 mm que estavam aqui antes não eram só injustificados: estavam
  # errados de escala. 20 mm em 24 h é chuva rotineira em Curitiba.
  #
  # DOIS CRITÉRIOS, como no INMET, e vale o mais severo. Alagamento urbano
  # responde a INTENSIDADE, não só a volume: 30 mm em 1 h alaga, os mesmos
  # 30 mm espalhados em 24 h não. Um único número não distingue os dois casos.
  justification_pending: false
  source: "INMET — critérios de Aviso Meteorológico para chuvas intensas"
  tiers:
    - name: leve
      label: "Chuva leve"
      hourly_mm: 0.0
      daily_mm: 0.0
      inmet_alert: "sem aviso"
    - name: forte
      label: "Chuva forte"
      hourly_mm: 20.0
      daily_mm: 50.0
      inmet_alert: "amarelo/laranja"
    - name: critica
      label: "Chuva crítica"
      hourly_mm: 60.0
      daily_mm: 100.0
      inmet_alert: "vermelho"

split:
  # Split espacial em blocos: tiles vizinhos vazam contexto e inflam a métrica.
  strategy: spatial_block
  # 5.120 m = 4x a pegada do patch (128 px x 10 m). O tamanho do bloco NÃO é
  # livre: o 'make-dataset' descarta todo patch cuja pegada toque blocos de
  # conjuntos diferentes, para que nenhum pixel apareça em dois conjuntos. Bloco
  # pequeno demais faz essa faixa morta comer o conjunto inteiro; bloco grande
  # demais deixa poucos blocos para sortear e a divisão 70/15/15 fica grosseira.
  # A configuração recusa bloco menor que o dobro da pegada do patch.
  block_size_m: 5120
  fractions:
    train: 0.70
    val: 0.15
    test: 0.15
  # Randomização RESTRITA, não garimpo de semente.
  #
  # O sorteio dos blocos pode dar ao treino a periferia e à validação o miolo
  # urbano. Como o Dice sobe com a prevalência da classe positiva, dois
  # conjuntos com proporções de impermeável muito diferentes produzem métricas
  # que não se comparam — a diferença medida seria de território, não de modelo.
  #
  # O critério está declarado AQUI, antes da varredura: o 'make-dataset' testa
  # sementes consecutivas a partir de 'project.random_seed' e aceita a PRIMEIRA
  # que fica dentro do limite (não a melhor de todas). Determinístico e
  # reprodutível por terceiro. A semente efetiva vai para patches/split.json.
  max_prevalence_spread_pp: 5.0
  max_seed_attempts: 200

model:
  arch: unet
  encoder: resnet34
  encoder_weights: imagenet
  in_channels: 4
  classes: 1
  loss:
    bce_weight: 0.5
    dice_weight: 0.5
  optimizer: adamw
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 16
  max_epochs: 100
  early_stopping_patience: 15
  scheduler: reduce_on_plateau
  # Windows: DataLoader com processos filhos usa 'spawn', que reimporta o módulo
  # e exige guarda de __main__. Com 483 patches pequenos o gargalo é a GPU, não
  # a leitura de disco, então 0 é mais rápido E mais simples aqui.
  num_workers: 0
  # Precisão mista. Em Blackwell é quase o dobro de velocidade sem efeito
  # mensurável na métrica desta tarefa. Ignorado quando não há GPU.
  amp: true
  # Augmentation: apenas o grupo D4 (4 rotações x espelhamento). Imagem orbital
  # não tem "em cima", então a simetria é real. NÃO há jitter radiométrico de
  # propósito — reflectância é grandeza física calibrada, e distorcê-la ensina
  # assinatura espectral que não existe. Ver src/floodrisk/model/data.py.
  augment: true

evaluation:
  # Limiar mínimo declarado no documento do TCC.
  dice_threshold: 0.75
  binarization_threshold: 0.5

tracking:
  mlflow_uri: sqlite:///mlruns.db
  experiment_name: flood-risk-curitiba

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  models: models
  reports: reports
  figures: reports/figures
  logs: logs
